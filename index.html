function findNameDay(name) {
  if (!name) return null;
  const first = name.toLowerCase().trim().split(/\s+/)[0].replace(/[^a-zα-ω]/gi, '');
  const md = NAME_DAYS[first];
  if (!md) return null;
  const [m, d] = md.split('-').map(Number);
  return { key: first, month: m, day: d, greek: GREEK_FORM[first] || name };
}

// DATE HELPERS
// ═══════════════════════════════════════════════════════════════════════
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW    = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pad    = n => String(n).padStart(2, '0');
const ymd    = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today  = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

function parseYMD(s) {
  if (!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtLong(d) {
  if (!d) return '';
  return `${DOW[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function startOfMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  return new Date(year, month, 1 - offset);
}
function nextOccurrence(it, from = today()) {
  if (CATS[it.type]?.recurring) {
    const y = from.getFullYear();
    const thisYear = new Date(y, (it.month || 1) - 1, it.day || 1);
    if (thisYear >= from) return thisYear;
    return new Date(y + 1, (it.month || 1) - 1, it.day || 1);
  }
  if (!it.date) return null;
  const d = parseYMD(it.date);
  return d >= from ? d : null;
}
function occurrencesForMonth(items, year, month) {
  const out = [];
  for (const it of items) {
    if (CATS[it.type]?.recurring) {
      if (it.month === month + 1) out.push({ ...it, displayDate: new Date(year, month, it.day) });
    } else if (it.date) {
      const start = parseYMD(it.date);
      const end = it.endDate ? parseYMD(it.endDate) : start;
      // Expand date range — show item on every day from start to end that falls in this month
      const cursor = new Date(start);
      while (cursor <= end) {
        if (cursor.getFullYear() === year && cursor.getMonth() === month) {
          out.push({ ...it, displayDate: new Date(cursor) });
        }
        cursor.setDate(cursor.getDate() + 1);
      }
    }
  }
  return out;
}

// GREEK PUBLIC HOLIDAYS (computed client-side, not stored in DB)
// ═══════════════════════════════════════════════════════════════════════
function greekHolidaysForYear(year) {
  const easter = GREEK_EASTER[year] ? parseYMD(GREEK_EASTER[year]) : null;
  const offset = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return ymd(x); };
  const fixed = [
    { id: `hol-${year}-01-01`, title: 'Πρωτοχρονιά',          subtitle: "New Year's Day",     date: `${year}-01-01` },
    { id: `hol-${year}-01-06`, title: 'Θεοφάνια',              subtitle: 'Epiphany',           date: `${year}-01-06` },
    { id: `hol-${year}-03-25`, title: '25η Μαρτίου',           subtitle: 'Independence Day',   date: `${year}-03-25` },
    { id: `hol-${year}-05-01`, title: 'Πρωτομαγιά',            subtitle: 'Labour Day',         date: `${year}-05-01` },
    { id: `hol-${year}-08-15`, title: 'Δεκαπενταύγουστος',     subtitle: 'Assumption of Mary', date: `${year}-08-15` },
    { id: `hol-${year}-10-28`, title: 'Ημέρα του Όχι',         subtitle: '"No" Day',           date: `${year}-10-28` },
    { id: `hol-${year}-12-25`, title: 'Χριστούγεννα',          subtitle: 'Christmas',          date: `${year}-12-25` },
    { id: `hol-${year}-12-26`, title: 'Σύναξη Θεοτόκου',       subtitle: 'Boxing Day',         date: `${year}-12-26` },
  ];
  if (easter) {
    fixed.push(
      { id: `hol-${year}-cm`, title: 'Καθαρά Δευτέρα',     subtitle: 'Clean Monday',  date: offset(easter, -48) },
      { id: `hol-${year}-gf`, title: 'Μεγάλη Παρασκευή',   subtitle: 'Good Friday',   date: offset(easter, -2)  },
      { id: `hol-${year}-pa`, title: 'Πάσχα',              subtitle: 'Easter Sunday', date: ymd(easter)         },
      { id: `hol-${year}-pm`, title: 'Δευτέρα του Πάσχα',  subtitle: 'Easter Monday', date: offset(easter, 1)   },
      { id: `hol-${year}-hs`, title: 'Αγίου Πνεύματος',    subtitle: 'Holy Spirit',   date: offset(easter, 50)  },
    );
  }
  return fixed.map(h => ({
    ...h, type: 'holiday', system: true, addedBy: 'system', rsvps: {}, createdAt: 0,
    notes: h.subtitle, location: '', link: '',
  }));
}
function allHolidays() {
  const y = new Date().getFullYear();
  return [...greekHolidaysForYear(y - 1), ...greekHolidaysForYear(y), ...greekHolidaysForYear(y + 1)];
}

function fromDb(row) {
  return {
    id: row.id,
    type: row.type,
    title: row.title,
    date: row.date,
    endDate: row.end_date,
    extraRanges: row.extra_ranges || [],
    time: row.time,
    month: row.month,
    day: row.day,
    location: row.location || '',
    link: row.link || '',
    notes: row.notes || '',
    greek: row.greek,
    meal: row.meal || '',
    cuisine: row.cuisine || '',
    addedBy: row.added_by,
    createdAt: row.created_at,
    rsvps: row.rsvps || {},
  };
}
function toDb(item) {
  return {
    id: item.id,
    type: item.type,
    title: item.title,
    date: item.date || null,
    end_date: item.endDate || null,
    time: item.time || null,
    month: item.month || null,
    day: item.day || null,
    location: item.location || '',
    link: item.link || '',
    notes: item.notes || '',
    greek: item.greek || null,
    meal: item.meal || null,
    cuisine: item.cuisine || null,
    added_by: item.addedBy,
    created_at: item.createdAt,
    rsvps: item.rsvps || {},
  };
}

async function dbLoadAll() {
  const { data, error } = await sb.from('items').select('*');
  if (error) { console.error(error); return []; }
  return data.map(fromDb);
}
async function dbInsert(item) {
  const { error } = await sb.from('items').insert([toDb(item)]);
  if (error) console.error(error);
}
async function dbUpdate(id, patch) {
  // Only patch the fields provided. Convert camelCase if present.
  const dbPatch = {};
  if ('title' in patch) dbPatch.title = patch.title;
  if ('type' in patch) dbPatch.type = patch.type;
  if ('date' in patch) dbPatch.date = patch.date || null;
  if ('endDate' in patch) dbPatch.end_date = patch.endDate || null;
  if ('time' in patch) dbPatch.time = patch.time || null;
  if ('month' in patch) dbPatch.month = patch.month || null;
  if ('day' in patch) dbPatch.day = patch.day || null;
  if ('location' in patch) dbPatch.location = patch.location || '';
  if ('link' in patch) dbPatch.link = patch.link || '';
  if ('notes' in patch) dbPatch.notes = patch.notes || '';
  if ('greek' in patch) dbPatch.greek = patch.greek || null;
  if ('meal' in patch) dbPatch.meal = patch.meal || null;
  if ('cuisine' in patch) dbPatch.cuisine = patch.cuisine || null;
  if ('rsvps' in patch) dbPatch.rsvps = patch.rsvps || {};
  const { error } = await sb.from('items').update(dbPatch).eq('id', id);
  if (error) console.error(error);
}
async function dbDelete(id) {
  const { error } = await sb.from('items').delete().eq('id', id);
  if (error) console.error(error);
}

const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const isInstagram = url => /instagram\.com/i.test(url || '');

// User name lives per-device in localStorage
const USER_KEY = 'pame:user';
const loadUser = () => { try { const v = localStorage.getItem(USER_KEY); return v ? JSON.parse(v) : null; } catch { return null; } };
const saveUser = (name) => { try { localStorage.setItem(USER_KEY, JSON.stringify({ name })); } catch {} };

// ═══════════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════════
function App() {
  const [user, setUser]           = useState(loadUser());
  const [nameInput, setNameInput] = useState('');
  const [bdMonth, setBdMonth]     = useState('');
  const [bdDay, setBdDay]         = useState('');
  const [userItems, setUserItems] = useState([]);
  const [loading, setLoading]     = useState(true);
  const [view, setView]           = useState('upnext');
  const [cursor, setCursor]       = useState(today());
  const [selectedDate, setSelectedDate] = useState(today());
  const [filter, setFilter]       = useState('all');
  const [adding, setAdding]       = useState(false);
  const [editing, setEditing]     = useState(null);
  const [toast, setToast]         = useState(null);
  const [linkPaste, setLinkPaste] = useState('');

  const items = useMemo(() => [...userItems, ...allHolidays()], [userItems]);

  // Load on mount
  useEffect(() => {
    (async () => {
      const items = await dbLoadAll();
      setUserItems(items);
      setLoading(false);
    })();
  }, []);

  // Real-time subscription — anyone's change shows up live for everyone
  useEffect(() => {
    const channel = sb
      .channel('items-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, async () => {
        const items = await dbLoadAll();
        setUserItems(items);
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, []);

  const refresh = useCallback(async () => {
    const items = await dbLoadAll();
    setUserItems(items);
    flash('refreshed');
  }, []);

  const monthItems = useMemo(
    () => occurrencesForMonth(items, cursor.getFullYear(), cursor.getMonth()),
    [items, cursor]
  );
  const itemsOnSelectedDay = useMemo(() => {
    if (!selectedDate) return [];
    return monthItems
      .filter(it => ymd(it.displayDate) === ymd(selectedDate))
      .filter(it => filter === 'all' || it.type === filter);
  }, [monthItems, selectedDate, filter]);

  const todaysCelebs = useMemo(() => {
    const t = today();
    return items.filter(it => {
      if (CATS[it.type]?.recurring) return it.month === t.getMonth() + 1 && it.day === t.getDate();
      return false;
    }).filter(it => it.type === 'birthday' || it.type === 'nameday' || it.type === 'holiday');
  }, [items]);

  function flash(message) { setToast(message); setTimeout(() => setToast(null), 2400); }

  if (loading) {
    return (
      <>
        <style>{FONTS}</style>
        <div style={{ minHeight: '100vh', background: C.bg, display: 'grid', placeItems: 'center', fontFamily: 'DM Sans, sans-serif', color: C.muted }}>
          opening πάμε…
        </div>
      </>
    );
  }

  if (!user?.name) {
    const trimmedName = nameInput.trim();
    const existingBirthday = trimmedName
      ? userItems.find(it =>
          it.type === 'birthday' &&
          (it.title || '').toLowerCase().includes(trimmedName.toLowerCase())
        )
      : null;

    const handleEnter = async () => {
      const name = nameInput.trim();
      if (!name) return;
      saveUser(name);
      setUser({ name });

      const newItems = [];
      const nd = findNameDay(name);
      if (nd) {
        const exists = userItems.some(it =>
          it.type === 'nameday' && it.month === nd.month && it.day === nd.day && (it.title || '').toLowerCase().includes(name.toLowerCase())
        );
        if (!exists) {
          newItems.push({
            id: newId(), type: 'nameday',
            title: `${name}'s name day`, greek: nd.greek,
            month: nd.month, day: nd.day,
            location: '', link: '', notes: `Saint's day for ${nd.greek}`,
            addedBy: name, createdAt: Date.now(), rsvps: {},
          });
        }
      }
      // Only add birthday if user filled it in AND none exists
      if (bdMonth && bdDay && !existingBirthday) {
        const m = Number(bdMonth), d = Number(bdDay);
        newItems.push({
          id: newId(), type: 'birthday',
          title: `${name}'s birthday`, month: m, day: d,
          location: '', link: '', notes: '',
          addedBy: name, createdAt: Date.now(), rsvps: {},
        });
      }
      if (newItems.length > 0) {
        for (const it of newItems) await dbInsert(it);
        const labels = [];
        if (newItems.some(it => it.type === 'nameday'))  labels.push('name day');
        if (newItems.some(it => it.type === 'birthday')) labels.push('birthday');
        flash(`Χρόνια πολλά in advance — added your ${labels.join(' & ')}`);
      }
    };
    return (
      <>
        <style>{FONTS}</style>
        <div style={{ minHeight: '100vh', background: C.bg, display: 'grid', placeItems: 'center', padding: '2rem' }}>
          <div className="px-fade" style={{
            background: C.paper, borderRadius: 14, padding: '2.5rem 2rem', maxWidth: 440, width: '100%',
            border: `1px solid ${C.hairline}`, boxShadow: '0 1px 2px rgba(30, 58, 95, 0.06)',
          }}>
            <div style={{ fontSize: '0.7rem', letterSpacing: '0.22em', textTransform: 'uppercase', color: C.muted, marginBottom: '0.4rem', fontWeight: 600 }}>welcome</div>
            <h1 style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontStyle: 'italic', fontSize: '3rem', color: C.ink, lineHeight: 1, margin: '0 0 0.4rem' }}>
              πάμε <span style={{ fontStyle: 'normal', fontSize: '0.65em', verticalAlign: 'middle' }}>🥂</span>
            </h1>
            <p style={{ color: C.inkSoft, fontSize: '0.95rem', margin: '0 0 1.6rem', lineHeight: 1.5 }}>
              the calendar for athens, the whole crew. birthdays, name days, dinners, taking plans out of the group chat.
            </p>

            <label style={{ display: 'block', fontSize: '0.72rem', letterSpacing: '0.1em', textTransform: 'uppercase', color: C.muted, fontWeight: 600, marginBottom: '0.4rem' }}>your name</label>
            <input autoFocus value={nameInput} onChange={e => setNameInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') handleEnter(); }}
              placeholder="e.g. Sabrina"
              style={{ width: '100%', boxSizing: 'border-box', padding: '0.8rem 0.9rem', fontSize: '1rem', fontFamily: 'DM Sans, sans-serif', background: C.bg, color: C.ink, border: `1px solid ${C.hairline}`, borderRadius: 10, marginBottom: '1rem' }} />

            {existingBirthday ? (
              <div style={{
                padding: '0.7rem 0.85rem', marginBottom: '1.2rem',
                background: `${C.birthday}10`, border: `1px dashed ${C.birthday}`,
                borderRadius: 10, fontSize: '0.85rem', color: C.ink,
                display: 'flex', alignItems: 'center', gap: '0.5rem',
              }}>
                <span style={{ fontSize: '1.1rem' }}>🎂</span>
                <span>welcome back — your birthday's already on the calendar ({MONTHS[existingBirthday.month-1]} {existingBirthday.day}).</span>
              </div>
            ) : (
              <>
                <label style={{ display: 'block', fontSize: '0.72rem', letterSpacing: '0.1em', textTransform: 'uppercase', color: C.muted, fontWeight: 600, marginBottom: '0.4rem' }}>
                  your birthday <span style={{ textTransform: 'none', letterSpacing: 0, color: C.muted, fontWeight: 400 }}>(optional)</span>
                </label>
                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '0.5rem' }}>
                  <select value={bdMonth} onChange={e => setBdMonth(e.target.value)}
                    style={{ width: '100%', boxSizing: 'border-box', padding: '0.8rem 0.9rem', fontSize: '0.95rem', fontFamily: 'DM Sans, sans-serif', background: C.bg, color: bdMonth ? C.ink : C.muted, border: `1px solid ${C.hairline}`, borderRadius: 10, appearance: 'none', cursor: 'pointer' }}>
                    <option value="">month…</option>
                    {MONTHS.map((m, i) => <option key={m} value={i+1}>{m}</option>)}
                  </select>
                  <input type="number" min="1" max="31" value={bdDay} onChange={e => setBdDay(e.target.value)} placeholder="day"
                    style={{ width: '100%', boxSizing: 'border-box', padding: '0.8rem 0.9rem', fontSize: '0.95rem', fontFamily: 'DM Sans, sans-serif', background: C.bg, color: C.ink, border: `1px solid ${C.hairline}`, borderRadius: 10 }} />
                </div>
                <p style={{ fontSize: '0.75rem', color: C.muted, margin: '0.7rem 0 1.4rem', fontStyle: 'italic' }}>
                  your birthday and (if it's Greek) your name day get added to the calendar automatically.
                </p>
              </>
            )}

            <button disabled={!nameInput.trim()} onClick={handleEnter}
              style={{ width: '100%', padding: '0.9rem', background: nameInput.trim() ? C.ink : C.hairline, color: nameInput.trim() ? C.paper : C.muted, border: 'none', borderRadius: 10, cursor: nameInput.trim() ? 'pointer' : 'default', fontFamily: 'DM Sans, sans-serif', fontWeight: 700, fontSize: '0.85rem', letterSpacing: '0.08em', textTransform: 'uppercase' }}>
              πάμε →
            </button>
          </div>
        </div>
      </>
    );
  }

  const addItem = async (data) => {
    const item = { id: newId(), ...data, addedBy: user.name, createdAt: Date.now(), rsvps: {} };
    setUserItems([...userItems, item]); // optimistic
    await dbInsert(item);
    flash('added');
  };
  const updateItem = async (id, patch) => {
    setUserItems(userItems.map(it => it.id === id ? { ...it, ...patch } : it));
    await dbUpdate(id, patch);
  };
  const deleteItem = async (id) => {
    if (!confirm('Delete this entry?')) return;
    setUserItems(userItems.filter(it => it.id !== id));
    await dbDelete(id);
  };
  const toggleRsvp = async (id, status) => {
    const it = userItems.find(i => i.id === id);
    if (!it) return;
    const rsvps = { ...(it.rsvps || {}) };
    if (rsvps[user.name] === status) delete rsvps[user.name];
    else rsvps[user.name] = status;
    setUserItems(userItems.map(x => x.id === id ? { ...x, rsvps } : x));
    await dbUpdate(id, { rsvps });
  };

  const handlePasteSubmit = () => {
    const url = linkPaste.trim();
    if (!url) return;
    setLinkPaste('');
    setAdding({ link: url, type: 'event' });
  };

  return (
    <>
      <style>{FONTS}</style>
      <div style={{ minHeight: '100vh', background: C.bg, color: C.ink, fontFamily: 'DM Sans, sans-serif', paddingBottom: '6rem' }}>
        <Header user={user} onRefresh={refresh} />
        {todaysCelebs.length > 0 && <CelebrationBanner celebs={todaysCelebs} userName={user.name} />}

        <div style={{ maxWidth: 980, margin: '0 auto', padding: '0 1.25rem' }}>
          <ViewTabs view={view} setView={setView} />
          {view === 'upnext' && (
            <div style={{ marginTop: '1rem', background: C.paper, borderRadius: 12, border: `1px solid ${C.hairline}`, padding: '0.55rem 0.55rem 0.55rem 0.95rem', display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
              <LinkIcon size={14} color={C.muted} />
              <input value={linkPaste} onChange={e => setLinkPaste(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') handlePasteSubmit(); }}
                placeholder="paste a link from the group chat — instagram, eventbrite, anything"
                style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none', fontFamily: 'DM Sans, sans-serif', fontSize: '0.88rem', color: C.ink }} />
              <button onClick={handlePasteSubmit} disabled={!linkPaste.trim()}
                style={{ padding: '0.5rem 0.9rem', background: linkPaste.trim() ? C.accent : C.hairline, color: linkPaste.trim() ? C.paper : C.muted, border: 'none', borderRadius: 8, cursor: linkPaste.trim() ? 'pointer' : 'default', fontFamily: 'DM Sans, sans-serif', fontWeight: 600, fontSize: '0.78rem', display: 'flex', alignItems: 'center', gap: '0.3rem' }}>
                <Plus size={12} /> add
              </button>
            </div>
          )}
          <FilterRow filter={filter} setFilter={setFilter} view={view} />

          {view === 'upnext'    && <UpNextView    items={items} filter={filter} user={user} onRsvp={toggleRsvp} onEdit={setEditing} onDelete={deleteItem} />}
          {view === 'festivals' && <FestivalsView items={items} user={user} onRsvp={toggleRsvp} onEdit={setEditing} onDelete={deleteItem} />}
          {view === 'tsintsin'  && <TsinTsinView  items={items} user={user} onRsvp={toggleRsvp} onEdit={setEditing} onDelete={deleteItem} />}
          {view === 'definitely'&& <DefinitelyView items={userItems} filter={filter} user={user} onRsvp={toggleRsvp} onEdit={setEditing} onDelete={deleteItem} onSchedule={(it) => setEditing(it)} />}
          {view === 'calendar'  && <CalendarView cursor={cursor} setCursor={setCursor} selectedDate={selectedDate} setSelectedDate={setSelectedDate} monthItems={monthItems} filter={filter} itemsOnSelectedDay={itemsOnSelectedDay} user={user} onRsvp={toggleRsvp} onEdit={setEditing} onDelete={deleteItem} onAddOnDate={(d) => { setSelectedDate(d); setAdding({ date: ymd(d) }); }} />}
        </div>

        <button onClick={() => setAdding({})}
          style={{ position: 'fixed', right: '1.5rem', bottom: '1.5rem', background: C.accent, color: C.paper, border: 'none', width: 60, height: 60, borderRadius: '50%', cursor: 'pointer', display: 'grid', placeItems: 'center', boxShadow: '0 8px 24px rgba(44, 95, 141, 0.32)', zIndex: 50 }}
          aria-label="Add new entry">
          <Plus size={26} strokeWidth={2.2} />
        </button>

        {(adding || editing) && (
          <AddEditModal initial={editing || adding} isEdit={!!editing}
            onClose={() => { setAdding(false); setEditing(null); }}
            onSubmit={async (data) => {
              if (editing) await updateItem(editing.id, data);
              else        await addItem(data);
              setAdding(false); setEditing(null);
            }} />
        )}

        {toast && (
          <div className="px-pop" style={{ position: 'fixed', bottom: '6.5rem', left: '50%', transform: 'translateX(-50%)', background: C.ink, color: C.paper, padding: '0.65rem 1.1rem', borderRadius: 999, fontSize: '0.82rem', fontFamily: 'DM Sans, sans-serif', zIndex: 60, boxShadow: '0 4px 14px rgba(30, 58, 95, 0.22)' }}>
            {toast}
          </div>
        )}
      </div>
    </>
  );
}

// CELEBRATION BANNER
// ═══════════════════════════════════════════════════════════════════════
function CelebrationBanner({ celebs, userName }) {
  const names = celebs.map(c => {
    if (c.type === 'holiday') return c.title;
    if (c.greek) return c.greek;
    return (c.title || '').replace(/['']s (birthday|name day|nameday)/i, '').trim();
  });
  const greeting =
    celebs.some(c => c.type === 'holiday' && /πάσχα/i.test(c.title)) ? 'Καλό Πάσχα' :
    celebs.some(c => c.type === 'holiday' && /πρωτοχρονιά/i.test(c.title)) ? 'Καλή Χρονιά' :
    celebs.some(c => c.type === 'holiday' && /χριστούγεννα/i.test(c.title)) ? 'Καλά Χριστούγεννα' : 'Χρόνια Πολλά';
  const isOwnDay = celebs.some(c =>
    (c.type === 'birthday' || c.type === 'nameday') &&
    (c.title || '').toLowerCase().includes(userName.toLowerCase())
  );
  return (
    <div className="px-fade" style={{ background: `linear-gradient(135deg, ${C.celebTop} 0%, ${C.celebBottom} 100%)`, borderBottom: `1px solid ${C.hairline}` }}>
      <div style={{ maxWidth: 980, margin: '0 auto', padding: '1.1rem 1.25rem', display: 'flex', alignItems: 'center', gap: '0.9rem' }}>
        <div className="px-shimmer" style={{ fontSize: '1.8rem', lineHeight: 1, flexShrink: 0 }}>🥂</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontStyle: 'italic', fontSize: 'clamp(1.1rem, 3.5vw, 1.4rem)', color: C.celebInk, lineHeight: 1.2 }}>
            {greeting}{isOwnDay ? `, ${userName}` : ''} — {names.join(' · ')}!
          </div>
          <div style={{ fontSize: '0.78rem', color: C.celebInk, opacity: 0.7, marginTop: '0.15rem' }}>
            {celebs.map(c => c.type === 'birthday' ? 'birthday today' : c.type === 'nameday' ? 'name day today' : (c.subtitle || c.title)).join(' · ')}
          </div>
        </div>
      </div>
    </div>
  );
}

      {tabs.map(t => {

function FilterRow({ filter, setFilter, view }) {
  if (view === 'tsintsin' || view === 'definitely' || view === 'festivals') return null;
  return (
    <div style={{ marginTop: '0.75rem', display: 'flex', gap: '0.4rem', flexWrap: 'wrap', alignItems: 'center' }}>
      <Pill active={filter === 'all'} onClick={() => setFilter('all')} label="All" />
      {CAT_KEYS.map(k => {
        const cat = CATS[k];
        const Icon = cat.icon;
        const active = filter === k;
        return (
          <button key={k} onClick={() => setFilter(k)}
            style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', padding: '0.4rem 0.75rem', borderRadius: 999, border: `1px solid ${active ? cat.color : C.hairline}`, background: active ? cat.color : 'transparent', color: active ? C.paper : C.inkSoft, cursor: 'pointer', fontSize: '0.76rem', fontWeight: 500, fontFamily: 'DM Sans, sans-serif', transition: 'all 0.15s' }}>
            <Icon size={12} /> {cat.plural}

}

function Pill({ active, onClick, label }) {

}

// UP NEXT
// ═══════════════════════════════════════════════════════════════════════
function UpNextView({ items, filter, user, onRsvp, onEdit, onDelete }) {
  const todayD = today();
  const upcoming = useMemo(() => items
    .filter(it => CATS[it.type]?.recurring || it.date)
    .filter(it => filter === 'all' || it.type === filter)
    .map(it => ({ ...it, occ: nextOccurrence(it, todayD) }))
    .filter(it => it.occ)
    .sort((a, b) => a.occ - b.occ)
    .slice(0, 60), [items, filter]);

  const groups = useMemo(() => {
    const m = new Map();
    for (const it of upcoming) {
      const k = ymd(it.occ);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(it);
    }
    return Array.from(m.entries());
  }, [upcoming]);

  return (
    <div className="px-fade" style={{ marginTop: '1.25rem' }}>
      <h2 style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontStyle: 'italic', fontSize: '1.7rem', color: C.ink, margin: '0 0 0.25rem' }}>up next</h2>
      <p style={{ fontSize: '0.84rem', color: C.muted, margin: '0 0 1.2rem' }}>the things we've actually said yes to.</p>
      {groups.length === 0 ? (
        <Empty text="nothing coming up. paste a link from the chat to start." />
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          {groups.map(([dateKey, dayItems]) => {
            const d = parseYMD(dateKey);
            const isTodayD = ymd(d) === ymd(todayD);
            const daysAway = Math.round((d - todayD) / 86400000);
            return (
              <div key={dateKey}>
                <DateHeader d={d} isToday={isTodayD} daysAway={daysAway} />
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.55rem' }}>
                  {dayItems.map(it => <ItemCard key={it.id + '-' + dateKey} item={it} user={user} onRsvp={onRsvp} onEdit={onEdit} onDelete={onDelete} />)}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DateHeader({ d, isToday, daysAway }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: '0.65rem', marginBottom: '0.55rem', borderBottom: `1px solid ${C.hairline}`, paddingBottom: '0.4rem' }}>
      <div style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: '1.5rem', color: C.ink, lineHeight: 1 }}>{d.getDate()}</div>
      <div>
        <div style={{ fontSize: '0.85rem', color: C.inkSoft, fontWeight: 500 }}>{DOW[(d.getDay()+6)%7]}, {MONTHS[d.getMonth()]}</div>
        <div style={{ fontSize: '0.7rem', color: C.muted }}>{isToday ? 'today' : daysAway === 1 ? 'tomorrow' : daysAway < 0 ? 'past' : `in ${daysAway} days`}</div>
      </div>
    </div>
  );
}

// FESTIVALS
// ═══════════════════════════════════════════════════════════════════════
function FestivalsView({ items, user, onRsvp, onEdit, onDelete }) {
  const todayD = today();
  const festivals = useMemo(() => items.filter(it => it.type === 'festival'), [items]);

  const { happeningNow, upcoming, past } = useMemo(() => {
    const now = [], up = [], pa = [];
    for (const f of festivals) {
      if (!f.date) continue;
      const start = parseYMD(f.date);
      const end = f.endDate ? parseYMD(f.endDate) : start;
      if (todayD >= start && todayD <= end) now.push(f);
      else if (start > todayD) up.push(f);
      else pa.push(f);
    }
    now.sort((a, b) => parseYMD(a.date) - parseYMD(b.date));
    up.sort((a, b) => parseYMD(a.date) - parseYMD(b.date));
    pa.sort((a, b) => parseYMD(b.date) - parseYMD(a.date));
    return { happeningNow: now, upcoming: up, past: pa };
  }, [festivals]);

  const renderFestival = (f) => <FestivalCard key={f.id} item={f} user={user} onRsvp={onRsvp} onEdit={onEdit} onDelete={onDelete} />;

  return (
    <div className="px-fade" style={{ marginTop: '1.25rem' }}>
      <h2 style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontStyle: 'italic', fontSize: '1.7rem', color: C.ink, margin: '0 0 0.25rem' }}>festivals</h2>
      <p style={{ fontSize: '0.84rem', color: C.muted, margin: '0 0 1.2rem' }}>the season's big ones — concerts, food fairs, neighborhood feasts.</p>

      {festivals.length === 0 && (
        <Empty text='no festivals yet. add one with the + button — pick "Festival" and set a start and end date.' />
      )}

      {happeningNow.length > 0 && (
        <FestivalSection
          label="happening now"
          accent={C.festival}
          pulse
        >
          {happeningNow.map(renderFestival)}
        </FestivalSection>
      )}

      {upcoming.length > 0 && (
        <FestivalSection label="coming up" accent={C.accent}>
          {upcoming.map(renderFestival)}
        </FestivalSection>
      )}

      {past.length > 0 && (
        <FestivalSection label="past" accent={C.muted} dim>
          {past.map(renderFestival)}
        </FestivalSection>
      )}
    </div>
  );
}

function FestivalSection({ label, accent, pulse, dim, children }) {
  return (
    <div style={{ marginBottom: '1.6rem', opacity: dim ? 0.65 : 1 }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: '0.5rem',
        marginBottom: '0.7rem', paddingBottom: '0.4rem',
        borderBottom: `1px solid ${C.hairline}`,
      }}>
        {pulse && (
          <span style={{
            width: 8, height: 8, borderRadius: '50%', background: accent,
            boxShadow: `0 0 0 0 ${accent}`,
            animation: 'pulse 1.6s ease-out infinite',
          }} />
        )}
        <span style={{
          fontSize: '0.7rem', letterSpacing: '0.18em', textTransform: 'uppercase',
          color: accent, fontWeight: 700,
        }}>
          {label}
        </span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>{children}</div>
    </div>
  );
}

function FestivalCard({ item, user, onRsvp, onEdit, onDelete }) {
  const cat = CATS.festival;
  const Icon = cat.icon;
  const myRsvp = item.rsvps?.[user.name];
  const yes   = Object.entries(item.rsvps || {}).filter(([,v]) => v === 'yes').map(([n]) => n);
  const maybe = Object.entries(item.rsvps || {}).filter(([,v]) => v === 'maybe').map(([n]) => n);
  const totalVotes = yes.length + maybe.length;
  const isOwner = item.addedBy === user.name;
  const ig = isInstagram(item.link);

  const start = item.date ? parseYMD(item.date) : null;
  const end = item.endDate ? parseYMD(item.endDate) : start;
  const todayD = today();
  const sameDay = start && end && ymd(start) === ymd(end);

  // Date range label
  const dateLabel = !start ? '' : sameDay
    ? fmtLong(start)
    : start.getMonth() === end.getMonth()
      ? `${start.getDate()}–${end.getDate()} ${MONTHS[start.getMonth()]}`
      : `${start.getDate()} ${MONTHS[start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;

  // Status text
  const statusLabel = (() => {
    if (!start) return null;
    if (todayD < start) {
      const days = Math.round((start - todayD) / 86400000);
      return days === 1 ? 'starts tomorrow' : `starts in ${days} days`;
    }
    if (todayD > end) return 'past';
    // happening now
    const totalDays = Math.round((end - start) / 86400000) + 1;
    const dayN = Math.round((todayD - start) / 86400000) + 1;
    return sameDay ? 'today' : `day ${dayN} of ${totalDays}`;
  })();

  return (
    <div className="px-pop" style={{
      background: C.paper, borderRadius: 12,
      border: `1px solid ${C.hairline}`,
      borderLeft: `3px solid ${cat.color}`,
      padding: '0.95rem 1rem',
    }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '0.75rem' }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', marginBottom: '0.2rem', flexWrap: 'wrap' }}>
            <Icon size={13} color={cat.color} strokeWidth={2.2} />
            <span style={{ fontSize: '0.62rem', letterSpacing: '0.16em', textTransform: 'uppercase', color: cat.color, fontWeight: 700 }}>{cat.label}</span>
            {statusLabel && <span style={{ fontSize: '0.7rem', color: C.muted }}>· {statusLabel}</span>}
          </div>
          <div style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: '1.15rem', color: C.ink, lineHeight: 1.25 }}>{item.title}</div>
          <div style={{
            marginTop: '0.3rem',
            fontFamily: 'Fraunces, serif', fontStyle: 'italic',
            fontSize: '0.92rem', color: cat.color, fontWeight: 500,
          }}>
            {dateLabel}
          </div>

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.6rem', marginTop: '0.45rem', fontSize: '0.78rem', color: C.inkSoft }}>
            {item.location && <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><MapPin size={11} /> {item.location}</span>}
            {item.link && (
              <a href={item.link} target="_blank" rel="noopener noreferrer" className="px-link"
                style={{ display: 'flex', alignItems: 'center', gap: 4, color: cat.color, textDecoration: 'none', fontWeight: 500 }}>
                {ig ? <Instagram size={11} /> : <ExternalLink size={11} />}
                {ig ? 'instagram' : 'link'}
              </a>
            )}
          </div>

          {item.notes && (
            <div style={{ marginTop: '0.55rem', fontSize: '0.85rem', color: C.inkSoft, fontFamily: 'Fraunces, serif', fontStyle: 'italic', lineHeight: 1.4 }}>{item.notes}</div>
          )}
        </div>
        <div style={{ display: 'flex', gap: '0.25rem', flexShrink: 0 }}>
          <IconBtn title="Edit" onClick={() => onEdit(item)}><Edit2 size={12} /></IconBtn>
          {isOwner && <IconBtn title="Delete" onClick={() => onDelete(item.id)}><Trash2 size={12} /></IconBtn>}
        </div>
      </div>

      <div style={{ marginTop: '0.7rem', paddingTop: '0.7rem', borderTop: `1px dashed ${C.hairline}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', marginBottom: '0.5rem' }}>
          <Vote size={11} color={cat.color} strokeWidth={2.2} />
          <span style={{ fontSize: '0.6rem', letterSpacing: '0.18em', textTransform: 'uppercase', color: cat.color, fontWeight: 700 }}>poll · who's going?</span>
          {totalVotes > 0 && <span style={{ fontSize: '0.7rem', color: C.muted, marginLeft: 'auto' }}>{totalVotes} {totalVotes === 1 ? 'vote' : 'votes'}</span>}
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', gap: '0.35rem' }}>
            <RsvpBtn active={myRsvp === 'yes'}   color={cat.color} onClick={() => onRsvp(item.id, 'yes')}>I'm going</RsvpBtn>
            <RsvpBtn active={myRsvp === 'maybe'} color={cat.color} variant="ghost" onClick={() => onRsvp(item.id, 'maybe')}>maybe</RsvpBtn>
          </div>
          <RsvpStack yes={yes} maybe={maybe} />
        </div>
      </div>

      <div style={{ marginTop: '0.5rem', fontSize: '0.65rem', color: C.muted, fontStyle: 'italic' }}>added by {item.addedBy}</div>
    </div>
  );
}

// CALENDAR
// ═══════════════════════════════════════════════════════════════════════
function CalendarView({ cursor, setCursor, selectedDate, setSelectedDate, monthItems, filter, itemsOnSelectedDay, user, onRsvp, onEdit, onDelete, onAddOnDate }) {
  const year  = cursor.getFullYear();
  const month = cursor.getMonth();
  const todayD = today();
  const filteredMonthItems = monthItems.filter(it => filter === 'all' || it.type === filter);

  const weeks = useMemo(() => {
    const start = startOfMonthGrid(year, month);
    const out = [];
    for (let w = 0; w < 6; w++) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        const day = new Date(start);
        day.setDate(start.getDate() + w * 7 + d);
        week.push(day);
      }
      out.push(week);
    }
    return out;
  }, [year, month]);

  const itemsByDay = useMemo(() => {
    const m = new Map();
    for (const it of filteredMonthItems) {
      const k = ymd(it.displayDate);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(it);
    }
    return m;
  }, [filteredMonthItems]);

  return (
    <div className="px-fade" style={{ marginTop: '1.25rem' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: '0.75rem' }}>
        <div>
          <div style={{ fontSize: '0.7rem', letterSpacing: '0.18em', textTransform: 'uppercase', color: C.muted }}>{year}</div>
          <h2 style={{ fontFamily: 'Fraunces, serif', fontWeight: 500, fontStyle: 'italic', fontSize: 'clamp(1.8rem, 5vw, 2.4rem)', color: C.ink, margin: 0, lineHeight: 1 }}>{MONTHS[month]}</h2>
        </div>
        <div style={{ display: 'flex', gap: '0.4rem' }}>
          <NavBtn onClick={() => setCursor(new Date(year, month - 1, 1))}><ChevronLeft size={16} /></NavBtn>
          <button onClick={() => { setCursor(todayD); setSelectedDate(todayD); }}
            style={{ background: 'transparent', border: `1px solid ${C.hairline}`, borderRadius: 999, padding: '0 0.85rem', cursor: 'pointer', fontFamily: 'DM Sans, sans-serif', fontSize: '0.78rem', color: C.inkSoft, height: 32 }}>today</button>
          <NavBtn onClick={() => setCursor(new Date(year, month + 1, 1))}><ChevronRight size={16} /></NavBtn>
        </div>
      </div>

      <div style={{ background: C.paper, borderRadius: 14, border: `1px solid ${C.hairline}`, overflow: 'hidden' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', background: C.bg, borderBottom: `1px solid ${C.hairline}` }}>
          {DOW.map(d => <div key={d} style={{ padding: '0.55rem 0', textAlign: 'center', fontSize: '0.62rem', letterSpacing: '0.18em', textTransform: 'uppercase', color: C.muted, fontWeight: 600 }}>{d}</div>)}
        </div>
        {weeks.map((week, wi) => (
          <div key={wi} style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)' }}>
            {week.map(day => {
              const inMonth = day.getMonth() === month;
              const isToday = ymd(day) === ymd(todayD);
              const isSelected = selectedDate && ymd(day) === ymd(selectedDate);
              const dayItems = itemsByDay.get(ymd(day)) || [];
              return (
                <button key={ymd(day)} className={`px-day ${isSelected ? 'px-day-selected' : ''}`}
                  onClick={() => setSelectedDate(day)} onDoubleClick={() => onAddOnDate(day)}
                  style={{ minHeight: 78, padding: '0.4rem 0.45rem', background: 'transparent', border: 'none', borderRight: `1px solid ${C.hairline}`, borderBottom: `1px solid ${C.hairline}`, cursor: 'pointer', textAlign: 'left', display: 'flex', flexDirection: 'column', gap: '0.3rem', opacity: inMonth ? 1 : 0.32, fontFamily: 'DM Sans, sans-serif', transition: 'background 0.12s' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span style={{ fontSize: '0.85rem', fontWeight: isToday ? 700 : 500, color: isToday ? C.paper : (inMonth ? C.ink : C.muted), background: isToday ? C.accent : 'transparent', width: 22, height: 22, borderRadius: '50%', display: 'grid', placeItems: 'center' }}>{day.getDate()}</span>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 2, overflow: 'hidden' }}>
                    {dayItems.slice(0, 3).map((it, i) => <DayChip key={it.id + '-' + i} item={it} />)}
                    {dayItems.length > 3 && <div style={{ fontSize: '0.65rem', color: C.muted, paddingLeft: 4 }}>+{dayItems.length - 3} more</div>}
                  </div>
                </button>
              );
            })}
          </div>
        ))}
      </div>

      <div style={{ marginTop: '0.75rem', display: 'flex', flexWrap: 'wrap', gap: '0.85rem', fontSize: '0.7rem', color: C.muted }}>
        {CAT_KEYS.map(k => {
          const cat = CATS[k];
          return <span key={k} style={{ display: 'flex', alignItems: 'center', gap: '0.3rem' }}><span style={{ width: 8, height: 8, borderRadius: 2, background: cat.color }} /> {cat.plural}</span>;
        })}
      </div>

      <div style={{ marginTop: '1.5rem' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '0.6rem' }}>
          <h3 style={{ fontFamily: 'Fraunces, serif', fontWeight: 500, fontStyle: 'italic', fontSize: '1.15rem', color: C.ink, margin: 0 }}>{fmtLong(selectedDate)}</h3>
          <button onClick={() => onAddOnDate(selectedDate)}
            style={{ background: 'transparent', border: `1px dashed ${C.hairline}`, borderRadius: 8, padding: '0.3rem 0.7rem', cursor: 'pointer', fontSize: '0.74rem', color: C.inkSoft, fontFamily: 'DM Sans, sans-serif', display: 'flex', alignItems: 'center', gap: '0.3rem' }}>
            <Plus size={12} /> add to this day
          </button>
        </div>
        {itemsOnSelectedDay.length === 0 ? (
          <Empty text="a quiet day in athens." />
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '0.55rem' }}>
            {itemsOnSelectedDay.map(it => <ItemCard key={it.id} item={it} user={user} onRsvp={onRsvp} onEdit={onEdit} onDelete={onDelete} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function NavBtn({ children, onClick }) {
  return (
    <button onClick={onClick} style={{ width: 32, height: 32, display: 'grid', placeItems: 'center', background: 'transparent', border: `1px solid ${C.hairline}`, borderRadius: 999, cursor: 'pointer', color: C.inkSoft }}>
      {children}
    </button>
  );
}

function DayChip({ item }) {
  const cat = CATS[item.type];
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4, background: `${cat.color}1a`, borderLeft: `2px solid ${cat.color}`, padding: '1px 4px', borderRadius: 3, fontSize: '0.66rem', color: C.ink, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', fontWeight: 500 }}>
      <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.title}</span>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// ITEM CARD
// ═══════════════════════════════════════════════════════════════════════
function ItemCard({ item, user, onRsvp, onEdit, onDelete, compact, onSchedule, showDate }) {
  const cat = CATS[item.type];
  const Icon = cat.icon;
  const myRsvp = item.rsvps?.[user.name];
  const isSystem = !!cat.system;
  const yes   = Object.entries(item.rsvps || {}).filter(([,v]) => v === 'yes').map(([n]) => n);
  const maybe = Object.entries(item.rsvps || {}).filter(([,v]) => v === 'maybe').map(([n]) => n);
  const totalVotes = yes.length + maybe.length;
  const isOwner = item.addedBy === user.name;
  const ig = isInstagram(item.link);
  const dateLabel = (() => {
    if (cat.recurring) {
      if (item.month && item.day) return `${MONTHS[item.month-1]} ${item.day}`;
      if (item.date) return fmtLong(parseYMD(item.date));
      return null;
    }
    if (!item.date) return 'someday';
    return fmtLong(parseYMD(item.date));
  })();

  return (
    <div className="px-pop" style={{ background: C.paper, borderRadius: 12, border: `1px solid ${C.hairline}`, borderLeft: `3px solid ${cat.color}`, padding: '0.85rem 1rem' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '0.75rem' }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', marginBottom: '0.2rem', flexWrap: 'wrap' }}>
            <Icon size={13} color={cat.color} strokeWidth={2.2} />
            <span style={{ fontSize: '0.62rem', letterSpacing: '0.16em', textTransform: 'uppercase', color: cat.color, fontWeight: 700 }}>{cat.label}</span>
            {showDate && dateLabel && <span style={{ fontSize: '0.7rem', color: C.muted }}>· {dateLabel}</span>}
            {item.greek && <span style={{ fontSize: '0.72rem', color: C.muted, fontStyle: 'italic' }}>· {item.greek}</span>}
          </div>
          <div style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontSize: '1.05rem', color: C.ink, lineHeight: 1.25 }}>{item.title}</div>

          {(item.meal || item.cuisine) && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.3rem', marginTop: '0.4rem' }}>
              {item.meal && (
                <span style={{
                  fontSize: '0.68rem', fontWeight: 600, color: C.restaurant,
                  background: `${C.restaurant}14`, padding: '0.15rem 0.5rem',
                  borderRadius: 999, letterSpacing: '0.04em',
                }}>{item.meal}</span>
              )}
              {item.cuisine && (
                <span style={{
                  fontSize: '0.68rem', fontWeight: 500, color: C.inkSoft,
                  background: C.bg, padding: '0.15rem 0.5rem', borderRadius: 999,
                  border: `1px solid ${C.hairline}`,
                }}>{item.cuisine}</span>
              )}
            </div>
          )}

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.6rem', marginTop: '0.4rem', fontSize: '0.78rem', color: C.inkSoft }}>
            {item.time && <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><Clock size={11} /> {item.time}</span>}
            {item.location && <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><MapPin size={11} /> {item.location}</span>}
            {item.link && (
              <a href={item.link} target="_blank" rel="noopener noreferrer" className="px-link"
                style={{ display: 'flex', alignItems: 'center', gap: 4, color: cat.color, textDecoration: 'none', fontWeight: 500 }}>
                {ig ? <Instagram size={11} /> : <ExternalLink size={11} />}
                {ig ? 'instagram' : 'link'}
              </a>
            )}
          </div>
          {item.notes && !isSystem && (
            <div style={{ marginTop: '0.55rem', fontSize: '0.85rem', color: C.inkSoft, fontFamily: 'Fraunces, serif', fontStyle: 'italic', lineHeight: 1.4 }}>{item.notes}</div>
          )}
        </div>
        {!isSystem && (
          <div style={{ display: 'flex', gap: '0.25rem', flexShrink: 0 }}>
            <IconBtn title="Edit" onClick={() => onEdit(item)}><Edit2 size={12} /></IconBtn>
            {isOwner && <IconBtn title="Delete" onClick={() => onDelete(item.id)}><Trash2 size={12} /></IconBtn>}
          </div>
        )}
      </div>

      {cat.rsvp && (
        <div style={{ marginTop: '0.7rem', paddingTop: '0.7rem', borderTop: `1px dashed ${C.hairline}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', marginBottom: '0.5rem' }}>
            <Vote size={11} color={cat.color} strokeWidth={2.2} />
            <span style={{ fontSize: '0.6rem', letterSpacing: '0.18em', textTransform: 'uppercase', color: cat.color, fontWeight: 700 }}>poll · who's in?</span>
            {totalVotes > 0 && <span style={{ fontSize: '0.7rem', color: C.muted, marginLeft: 'auto' }}>{totalVotes} {totalVotes === 1 ? 'vote' : 'votes'}</span>}
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', gap: '0.35rem' }}>
              <RsvpBtn active={myRsvp === 'yes'}   color={cat.color} onClick={() => onRsvp(item.id, 'yes')}>I'm in</RsvpBtn>
              <RsvpBtn active={myRsvp === 'maybe'} color={cat.color} variant="ghost" onClick={() => onRsvp(item.id, 'maybe')}>maybe</RsvpBtn>
            </div>
            <RsvpStack yes={yes} maybe={maybe} />
          </div>
        </div>
      )}

      {compact && !item.date && !cat.recurring && onSchedule && (
        <button onClick={() => onSchedule(item)}
          style={{ marginTop: '0.6rem', width: '100%', padding: '0.45rem', background: 'transparent', border: `1px dashed ${cat.color}`, borderRadius: 8, color: cat.color, cursor: 'pointer', fontFamily: 'DM Sans, sans-serif', fontSize: '0.76rem', fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.3rem' }}>
          <CalIcon size={12} /> set a date
        </button>
      )}

      {!isSystem && (
        <div style={{ marginTop: '0.5rem', fontSize: '0.65rem', color: C.muted, fontStyle: 'italic' }}>added by {item.addedBy}</div>
      )}
    </div>
  );
}

function RsvpBtn({ active, color, onClick, children, variant }) {
  const ghost = variant === 'ghost';
  return (
    <button onClick={onClick}
      style={{ padding: '0.4rem 0.8rem', borderRadius: 999, cursor: 'pointer', fontSize: '0.74rem', fontWeight: 600, fontFamily: 'DM Sans, sans-serif', border: `1px solid ${active ? color : C.hairline}`, background: active ? color : 'transparent', color: active ? C.paper : (ghost ? C.muted : C.inkSoft), transition: 'all 0.15s' }}>
      {children}
    </button>
  );
}

function RsvpStack({ yes, maybe }) {
  if (yes.length === 0 && maybe.length === 0) return <span style={{ fontSize: '0.7rem', color: C.muted, fontStyle: 'italic' }}>be the first to vote</span>;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.7rem', color: C.muted, flexWrap: 'wrap' }}>
      {yes.length > 0 && (
        <span style={{ display: 'flex', alignItems: 'center', gap: '0.3rem' }}>
          <Users size={11} /><strong style={{ color: C.ink, fontWeight: 700 }}>{yes.length}</strong> in
          <span style={{ color: C.muted }}>· {yes.join(', ')}</span>
        </span>
      )}
      {maybe.length > 0 && <span style={{ color: C.muted }}>+{maybe.length} maybe</span>}
    </div>
  );
}

function IconBtn({ children, onClick, title }) {
  return (
    <button onClick={onClick} title={title}
      style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: C.muted, padding: 4, display: 'grid', placeItems: 'center', borderRadius: 6 }}>
      {children}
    </button>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// ADD / EDIT MODAL
// ═══════════════════════════════════════════════════════════════════════
function AddEditModal({ initial, isEdit, onClose, onSubmit }) {
  const [type, setType]         = useState(initial.type || 'event');
  const [title, setTitle]       = useState(initial.title || '');
  const [date, setDate]         = useState(initial.date || '');
  const [endDate, setEndDate]   = useState(initial.endDate || '');
  const [month, setMonth]       = useState(initial.month || '');
  const [day, setDay]           = useState(initial.day || '');
  const [time, setTime]         = useState(initial.time || '');
  const [location, setLocation] = useState(initial.location || '');
  const [link, setLink]         = useState(initial.link || '');
  const [notes, setNotes]       = useState(initial.notes || '');
  const [meal, setMeal]         = useState(initial.meal || '');
  const [cuisine, setCuisine]   = useState(initial.cuisine || '');

  const cat = CATS[type];
  const ig  = isInstagram(link);
  const canSave = title.trim() && (cat.recurring ? (month && day) : true);

  const submit = () => {
    if (!canSave) return;
    const data = { type, title: title.trim(), location: location.trim(), link: link.trim(), notes: notes.trim(), meal: meal.trim(), cuisine: cuisine.trim() };
    if (cat.recurring) {
      data.month = Number(month); data.day = Number(day);
      data.date = null; data.time = null; data.endDate = null;
    } else {
      data.date = date || null; data.time = time || null;
      data.endDate = type === 'festival' ? (endDate || null) : null;
      data.month = null; data.day = null;
    }
    onSubmit(data);
  };

  const ndSuggestion = type === 'nameday' ? findNameDay(title) : null;

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(30, 58, 95, 0.45)', display: 'grid', placeItems: 'center', padding: '1rem', zIndex: 100 }}>
      <div className="px-pop" onClick={e => e.stopPropagation()}
        style={{ background: C.paper, borderRadius: 14, padding: '1.5rem', width: '100%', maxWidth: 500, maxHeight: '90vh', overflowY: 'auto', border: `1px solid ${C.hairline}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1rem' }}>
          <div>
            <div style={{ fontSize: '0.65rem', letterSpacing: '0.2em', textTransform: 'uppercase', color: C.muted, fontWeight: 600 }}>{isEdit ? 'edit entry' : 'new entry'}</div>
            <h2 style={{ fontFamily: 'Fraunces, serif', fontWeight: 600, fontStyle: 'italic', fontSize: '1.5rem', color: C.ink, margin: '0.2rem 0 0' }}>add to πάμε</h2>
          </div>
          <button onClick={onClose} style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: C.muted, padding: 4 }}><X size={20} /></button>
        </div>

        <Label>type</Label>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(85px, 1fr))', gap: '0.4rem', marginBottom: '1rem' }}>
          {USER_CATS.map(k => {
            const c = CATS[k]; const Ic = c.icon; const active = type === k;
            return (
              <button key={k} onClick={() => setType(k)}
                style={{ padding: '0.65rem 0.4rem', borderRadius: 10, cursor: 'pointer', border: `1px solid ${active ? c.color : C.hairline}`, background: active ? `${c.color}14` : C.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.3rem', fontFamily: 'DM Sans, sans-serif', fontSize: '0.72rem', fontWeight: 600, color: active ? c.color : C.inkSoft, transition: 'all 0.15s' }}>
                <Ic size={16} strokeWidth={2.2} /> {c.label}
              </button>
            );
          })}
        </div>

        <Label>{type === 'birthday' || type === 'nameday' ? 'whose' : 'title'}</Label>
        <Input value={title} onChange={setTitle}
          placeholder={
            type === 'birthday'   ? "e.g. Maria's birthday" :
            type === 'nameday'    ? "e.g. Eleni" :
            type === 'restaurant' ? "e.g. Mavro Provato" :
            type === 'outing'     ? "e.g. day trip to Hydra" : "e.g. rooftop cinema night"
          } autoFocus />

        {ndSuggestion && type === 'nameday' && (
          <button onClick={() => { setMonth(ndSuggestion.month); setDay(ndSuggestion.day); }}
            style={{ width: '100%', padding: '0.55rem 0.8rem', marginBottom: '0.8rem', background: `${C.nameday}14`, border: `1px dashed ${C.nameday}`, borderRadius: 8, cursor: 'pointer', textAlign: 'left', fontFamily: 'DM Sans, sans-serif', fontSize: '0.78rem', color: C.ink, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
            <Sparkles size={13} color={C.nameday} />
            <span><strong>{ndSuggestion.greek}</strong> · {MONTHS[ndSuggestion.month-1]} {ndSuggestion.day} — <span style={{ color: C.inkSoft }}>tap to use</span></span>
          </button>
        )}

        {cat.recurring ? (
          <>
            <Label>date <span style={{ color: C.muted, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(repeats yearly)</span></Label>
            <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '0.5rem', marginBottom: '0.8rem' }}>
              <select value={month} onChange={e => setMonth(e.target.value)} style={selectStyle()}>
                <option value="">month…</option>
                {MONTHS.map((m, i) => <option key={m} value={i+1}>{m}</option>)}
              </select>
              <input type="number" min="1" max="31" value={day} onChange={e => setDay(e.target.value)} placeholder="day" style={inputStyle()} />
            </div>
          </>
        ) : type === 'festival' ? (
          <>
            <Label>start date</Label>
            <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ ...inputStyle(), marginBottom: '0.6rem' }} />
            <Label>end date <span style={{ color: C.muted, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(same as start if it's one day)</span></Label>
            <input type="date" value={endDate} min={date || undefined} onChange={e => setEndDate(e.target.value)} style={{ ...inputStyle(), marginBottom: '0.8rem' }} disabled={!date} />
          </>
        ) : (
          <>
            <Label>date <span style={{ color: C.muted, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(blank = lands in "We Should Definitely Do This")</span></Label>
            <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '0.5rem', marginBottom: '0.8rem' }}>
              <input type="date" value={date} onChange={e => setDate(e.target.value)} style={inputStyle()} />
              <input type="time" value={time} onChange={e => setTime(e.target.value)} style={inputStyle()} disabled={!date} />
            </div>
          </>
        )}

        {(type === 'event' || type === 'restaurant' || type === 'outing' || type === 'festival' || type === 'birthday') && (
          <>
            <Label>location</Label>
            <Input value={location} onChange={setLocation} placeholder="e.g. Koukaki, Athens" />
          </>
        )}

        {type === 'restaurant' && (
          <>
            <Label>meal <span style={{ color: C.muted, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(optional)</span></Label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.35rem', marginBottom: '0.8rem' }}>
              {MEAL_OPTIONS.map(m => {
                const active = meal === m;
                return (
                  <button key={m} type="button" onClick={() => setMeal(active ? '' : m)}
                    style={{
                      padding: '0.35rem 0.7rem', borderRadius: 999, cursor: 'pointer',
                      border: `1px solid ${active ? C.restaurant : C.hairline}`,
                      background: active ? C.restaurant : 'transparent',
                      color: active ? C.paper : C.inkSoft,
                      fontFamily: 'DM Sans, sans-serif', fontSize: '0.74rem', fontWeight: 500,
                    }}>
                    {m}
                  </button>
                );
              })}
            </div>

            <Label>cuisine <span style={{ color: C.muted, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(pick one or type your own)</span></Label>
            <input list="cuisine-options" value={cuisine} onChange={e => setCuisine(e.target.value)}
              placeholder="e.g. Greek, taverna, Italian, Mexican…"
              style={{ ...inputStyle(), marginBottom: '0.8rem' }} />
            <datalist id="cuisine-options">
              {CUISINE_OPTIONS.map(c => <option key={c} value={c} />)}
            </datalist>
          </>
        )}

        {(type === 'event' || type === 'restaurant' || type === 'outing' || type === 'festival') && (
          <>
            <Label>link {ig && <span style={{ color: C.event, fontWeight: 500, textTransform: 'none', letterSpacing: 0 }}>· instagram detected</span>}</Label>
            <Input value={link} onChange={setLink} placeholder="paste a url — instagram, eventbrite, anything" />
          </>
        )}

        <Label>notes <span style={{ color: C.muted, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>(optional)</span></Label>
        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3}
          placeholder="anything to know — dress code, what to bring, why this place…"
          style={{ ...inputStyle(), resize: 'vertical', fontFamily: 'DM Sans, sans-serif' }} />

        <div style={{ display: 'flex', gap: '0.5rem', marginTop: '1.25rem' }}>
          <button onClick={onClose}
            style={{ flex: 1, padding: '0.85rem', background: 'transparent', color: C.inkSoft, border: `1px solid ${C.hairline}`, borderRadius: 10, cursor: 'pointer', fontFamily: 'DM Sans, sans-serif', fontSize: '0.85rem', fontWeight: 600, letterSpacing: '0.05em', textTransform: 'uppercase' }}>cancel</button>
          <button onClick={submit} disabled={!canSave}
            style={{ flex: 2, padding: '0.85rem', background: canSave ? C.accent : C.hairline, color: canSave ? C.paper : C.muted, border: 'none', borderRadius: 10, cursor: canSave ? 'pointer' : 'default', fontFamily: 'DM Sans, sans-serif', fontSize: '0.85rem', fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.4rem' }}>
            <Check size={14} /> {isEdit ? 'save' : 'add'}
          </button>
        </div>
      </div>
    </div>
  );
}

function Label({ children }) {
  return (
    <label style={{ display: 'block', fontSize: '0.68rem', letterSpacing: '0.12em', textTransform: 'uppercase', color: C.muted, fontWeight: 700, marginBottom: '0.35rem', marginTop: '0.5rem' }}>
      {children}
    </label>
  );
}

function Input({ value, onChange, placeholder, autoFocus }) {
  return (
    <input autoFocus={autoFocus} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
      style={{ ...inputStyle(), marginBottom: '0.8rem' }} />
  );
}

function inputStyle() {
  return { width: '100%', boxSizing: 'border-box', padding: '0.7rem 0.85rem', fontSize: '0.94rem', fontFamily: 'DM Sans, sans-serif', background: C.bg, color: C.ink, border: `1px solid ${C.hairline}`, borderRadius: 10 };
}
function selectStyle() {
  return { ...inputStyle(), appearance: 'none', cursor: 'pointer' };
}

// ═══════════════════════════════════════════════════════════════════════
// MOUNT
// ═══════════════════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
